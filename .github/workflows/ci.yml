name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: lint + unit + fuzz
    # Pinned: the e2e package names (Makefile PKGS_*) are for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: make lint
      - run: make unit
      - run: make fuzz FUZZTIME=30s

  e2e:
    name: e2e (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # native: x86_64 C (PIE, non-PIE, static, static-PIE, shared, big bss)
        #         and Go (static, cgo, PIE), run natively.
        # others: cross-compiled C (PIE, non-PIE, static, shared) and static Go,
        #         run under qemu-user, whose ELF loader computes AT_PHDR like
        #         Linux < 5.18, so these also cover legacy-kernel placement.
        target: [native, aarch64, armhf, i686, riscv64, s390x, ppc64, mips]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install toolchains
        run: make deps E2E_TARGETS=${{ matrix.target }}
      - name: End-to-end test
        run: make e2e E2E_TARGETS=${{ matrix.target }} STRICT=1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.target }}
          path: build/e2e/report.txt
          if-no-files-found: ignore
